name: Build iPhone app (unsigned IPA)

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/house-capture/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/house-capture
        run: xcodegen generate

      - name: Build (Release, unsigned)
        working-directory: apps/house-capture
        run: |
          set -o pipefail
          xcodebuild -project HouseCapture.xcodeproj -scheme HouseCapture \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -200

      - name: Package IPA
        working-directory: apps/house-capture
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "App bundle: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry HouseCapture.ipa Payload
          ls -lh HouseCapture.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-ipa
          path: apps/house-capture/HouseCapture.ipa

      - name: Publish as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            apps/house-capture/HouseCapture.ipa \
            --repo "${{ github.repository }}" \
            --title "HouseCapture unsigned IPA #${{ github.run_number }}" \
            --notes "Unsigned build for sideloading (Sideloadly / AltStore). Built from ${{ github.sha }}."
